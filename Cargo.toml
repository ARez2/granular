[package]
name = "granular"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["granular-core", "examples/*"]
# exclude = [
#     "examples/*"
# ]

[features]
default = []
trace = ["granular-core/trace"]

[dependencies]
granular-core = { path = "granular-core" }
palette.workspace = true
wgpu.workspace = true


[workspace.dependencies]
geese = "0.3.11"
log = "0.4.33"
winit = { version = "*" }
palette = "0.7.5"
web-time = "1.1.0"
wgpu = "30.0.0"
# Profiling:
profiling = { version = "1.0.18" }
wgpu-profiler = { version = "0.28.0", features = ["tracy"] }
# version 0.18.4 ==> Tracy 13.1 
tracy-client = { version = "0.18.4", features = ["verify"] }
